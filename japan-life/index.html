ずつでいいね→まず寝る場所があると、ほっとするよ。|家具は全部持っていきたい→使わない間は保管箱にしまっておけるよ。`],[`試着／しちゃく`,`今日は明るい色にしようかな→散歩の景色も、少し違って見えるかも。|落ち着いた色が好きなんだ→好きなものを選んでいいんだよ。`],[`花瓶／かびん`,`机の上に一輪置いてみたい→座ったときに見える場所がよさそうね。|緑の鉢植えも好き→葉の形もいろいろあって楽しいね。`],[`焼きたて／やきたて`,`香ばしい匂いが好き→店を開ける朝の楽しみなんだ。|冷めてからのパンも好き→ゆっくり味わえるよね。`],[`惣菜／そうざい`,`作らない日があってもいいね→そう思うと、少し気が楽になるね。|私は簡単なものを作ろうかな→あたたかいごはんだけでも、うれしいね。`],[`窓際／まどぎわ`,`分かる。ぼーっとするのにいいね→そうそう。気づくと時間がたってるんだ。|私は奥の静かな席も好き→ああ、あっちも落ち着くね。|外を見ると、つい出かけたくなるかも→それもいいね。今日はどこまで行くの？`],[`置く場所／おくばしょ`,`机の上を少し空けてみようかな→好きなものの場所を作るのも楽しいね。|今日は見るだけにしておこう→また来たときに考えてもいいよね。`],[`通り／とおり`,`寄り道できる場所があるといいね→小さなベンチも増やしたいな。|何も買わずに歩く日も好き→そんな日にも来てもらえるとうれしいね。`],[`内見／ないけん`,`窓からの景色を見たいな→三つとも、中を歩いて見ていってね。|家具の置きやすさも大事だね→今の家具が入るかも考えてみて。`],[`共用／きょうよう`,`出口の近くは空けておくね→ありがとう。毎日の出入りが楽になるね。|自分の部屋でも通り道は大事だね→家具を置くときも忘れないでね。`],[`模様替え／もようがえ`,`座る場所からの景色も変わるね→朝の光が入るようになったんだ。|私も配置を考えてみたい→少し動かすだけでも楽しいよ。`],[`たこめし／たこと米を炊く郷土料理`,`次の食事の楽しみがあるのはいいね→だしの匂いだけでもお腹がすくよ。|私は一食ずつ作るのが好き→その日の気分で選べるよね。`],[`生成り／きなり`,`青いカーテンはどう？→海を思い出す色でいいかもしれないね。|生成りの落ち着いた色も好き→家具の木の色とも合いそうね。`],[`夜勤／やきん`,`ゆっくり休めるといいね→ありがとう。今日はのんびり過ごすよ。|休みの日は散歩もいいね→起きてから気が向いたら、海まで行こうかな。`],[`園芸／えんげい`,`小さな変化を見つけるのが楽しいね→昨日なかった葉を見ると、うれしいの。|植物の世話はまだ慣れなくて→まず一鉢からでもいいと思うよ。`],[`飽きない／あきない`,`気分で聴こえ方が変わることもあるね→そう。散歩の後に聴くと、また違うんだ。|静かに過ごす時間も好き→静かな時間があると、次の一曲も楽しめるね。`],[`一章／いっしょう`,`続きが気になると眠れないね→今日はここまで、の印を挟んだんだけどね。|私は短い話を少しずつ読むよ→毎日の楽しみにできそうだね。`],[`自転車／じてんしゃ`,`歩くと小さな店に気づくね→今日は路地の植木にも気づいたよ。|荷物が多い日は大変そう→今日は少なめに買って帰るつもり。`],[`日当たり／ひあたり`,`あたたかい場所を選ぶのが上手だね→見てると、こっちまで眠くなるね。|少し離れて見守ろう→うん。驚かせずに見ていようね。`],[`思い出／おもいで`,`飾って残すのもいいね→箱の中より、目に入る場所もよさそう。|今は保管して考えてもいいね→急いで決めなくていいんだね。`],[`目印／めじるし`,`喫茶つばめの看板が分かりやすいよ→ありがとう。今度はそこを目印にしてみる。|一緒に地図を見ようか→助かる。海はこっちなんだね。`],[`古参／こさん`,`新しい店を知るのも楽しいね→変わっていく町を見るのも、悪くないよ。|昔からの店の話も聞きたいな→またゆっくり話そうか。`],[`壁飾り／かべかざり`,`好きな景色のポスターはいいね→帰ってきたとき、目に入るのがうれしいの。|私は机の上から整えたい→小さなものからでも、自分の部屋になるね。`],[`案内／あんない`,`食材を買えるところを知りたい→商店街のこめのやだね。地図でも確認できるよ。|まずは自分で歩いてみるよ→迷ったら、また声をかけてね。`],[`木陰／こかげ`,`少し遠回りするのもいいね→朝から急がないで歩けるとうれしいね。|私は海の方を通るのも好き→今度、そっちから歩いてみようかな。`],[`普段／ふだん`,`日々の買い物も町の楽しみだね→小さなお店にも立ち寄ってみてね。|観光の景色
