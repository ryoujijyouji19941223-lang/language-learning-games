<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#244f54" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%279%27 fill=%27%23315e58%27/%3E%3Ctext x=%2720%27 y=%2729%27 text-anchor=%27middle%27 font-size=%2728%27 fill=%27%23fcf8ec%27%3E汐%3C/text%3E%3C/svg%3E"
    />
    <title>汐待町 ― 日本の暮らし</title>
  </head>
  <body>
    <div id="world" aria-label="主人公が歩く3Dの町"></div>
    <div id="loading">汐待町を準備しています…</div>
    <div id="save-warning" role="status" hidden></div>
    <div id="hud"></div>
    <div id="context"></div>
    <div id="overlay"></div>
    <div id="toast" role="status"></div>
    <div id="touch-controls">
      <div id="stick" aria-label="タッチで歩く"><span></span></div>
      <div id="look-pad" aria-label="ドラッグで視点を変える"></div>
      <button id="touch-interact" aria-label="近くを調べる">調べる</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
