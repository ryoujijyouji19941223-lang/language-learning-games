    <style>
@charset "UTF-8";
:root {
  --paper: #f7f3e8;
  --ink: #283c38;
  --muted: #6d7971;
  --green: #276354;
  --line: #dedfd2;
  --coral: #d06c4f;
  --cream: #fffdf7;
  --yellow: #e4b653;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
  font-size: 16px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select,
summary {
  touch-action: manipulation;
}
button {
  cursor: pointer;
  border: 0;
  color: inherit;
}
button:disabled {
  cursor: default;
}
a {
  color: inherit;
  text-decoration: none;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--coral);
  outline-offset: 4px;
}
button {
  transition:
    background 0.16s,
    transform 0.16s;
}
button:hover {
  filter: brightness(0.96);
}
button:active {
  transform: translateY(1px);
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  font-weight: 700;
}
h1 {
  letter-spacing: 0.03em;
  line-height: 1.6;
}
p {
  line-height: 1.9;
}
img {
  max-width: 100%;
}
[hidden] {
  display: none !important;
}
.site-header,
main,
body > footer {
  max-width: 1180px;
  margin: auto;
}
.site-header {
  min-height: 112px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding: 20px 0;
  gap: 12px;
}
.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 0.03em;
}
.brand-mark {
  border: 1px solid var(--green);
  border-radius: 50%;
  height: 43px;
  width: 43px;
  display: grid;
  place-items: center;
  color: var(--green);
  font-size: 23px;
  font-family: serif;
}
.brand small {
  display: block;
  font: 9px/2 sans-serif;
  letter-spacing: 0.22em;
  color: var(--muted);
}
nav {
  display: flex;
  gap: 12px;
}
nav button {
  background: transparent;
  padding: 12px 18px;
  font-size: 13px;
  border-radius: 6px;
}
nav button:last-child {
  border: 1px solid #c6cbbd;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 0.17em;
  color: var(--green);
  font-weight: bold;
  line-height: 1.8;
}
.tiny-line {
  display: inline-block;
  vertical-align: middle;
  width: 24px;
  height: 1px;
  background: var(--green);
  margin-right: 10px;
}
.muted,
.micro {
  color: var(--muted);
}
.muted {
  font-size: 14px;
}
.micro {
  font-size: 11px;
  line-height: 1.9;
}
.hero {
  display: grid;
  grid-template-columns: 1.08fr 1fr;
  align-items: center;
  gap: 65px;
  padding: 70px 25px 68px;
}
.hero h1 {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 54px;
  font-weight: 600;
  letter-spacing: 0.04em;
  line-height: 1.65;
  margin: 18px 0 20px;
}
.accent {
  color: var(--green);
}
.hero-description {
  font-size: 14px;
  line-height: 2.2;
  color: #58665e;
}
.hero-actions {
  display: flex;
  align-items: center;
  gap: 20px;
  margin: 30px 0 13px;
  flex-wrap: wrap;
}
.primary {
  background: var(--green);
  color: white;
  border: 1px solid var(--green);
  padding: 12px 22px;
  border-radius: 7px;
  font-size: 14px;
  font-weight: bold;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
}
.large {
  padding: 17px 24px;
  min-height: 56px;
}
.primary.large span {
  margin-left: 10px;
}
.quiet {
  background: var(--cream);
  border: 1px solid #d4d9c9;
  border-radius: 6px;
  min-height: 44px;
  padding: 11px 16px;
  font-size: 13px;
}
.text-button {
  background: transparent;
  padding: 11px 2px;
  min-height: 44px;
  font-size: 12px;
}
.small {
  font-size: 12px;
  min-height: 40px;
  padding: 9px 13px;
}
.full {
  width: 100%;
  margin: 18px 0 5px;
}
.shop-illustration {
  position: relative;
  max-width: 450px;
  transform: rotate(1.4deg);
  border: 2px solid #456b58;
  border-radius: 10px 10px 0 0;
  box-shadow: 12px 14px 0 #e5e6d7;
}
.shop-sign {
  background: var(--green);
  color: #f7eed1;
  font:
    12px Georgia,
    serif;
  letter-spacing: 0.22em;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-radius: 7px 7px 0 0;
}
.shop-sign span {
  font: 9px sans-serif;
  letter-spacing: 0.12em;
  border: 1px solid #c5d3bb;
  border-radius: 2px;
  padding: 4px;
}
.awning {
  height: 42px;
  position: relative;
  z-index: 2;
  background: repeating-linear-gradient(
    90deg,
    #e4aa76 0 38px,
    #faf1d8 38px 76px
  );
  border-bottom: 2px solid #8e7553;
  clip-path: polygon(
    0 0,
    100% 0,
    100% 88%,
    95% 100%,
    87% 88%,
    79% 100%,
    71% 88%,
    63% 100%,
    55% 88%,
    47% 100%,
    39% 88%,
    31% 100%,
    23% 88%,
    15% 100%,
    7% 88%,
    0 100%
  );
}
.shop-wall {
  height: 300px;
  background: #e9e8ce;
  position: relative;
  overflow: hidden;
  background-image: linear-gradient(
    90deg,
    transparent 49.5%,
    #d7dcc2 50%,
    transparent 50.5%
  );
}
.shop-wall:before {
  content: "";
  position: absolute;
  inset: 25px;
  border: 8px solid #d2d8ba;
  background: #f8f1d6;
  border-radius: 100px 100px 0 0;
}
.sun {
  position: absolute;
  top: 43px;
  left: 56px;
  color: var(--yellow);
  font-size: 55px;
}
.fox {
  position: absolute;
  right: 28px;
  bottom: 21px;
  width: 175px;
  height: 175px;
}
.speech-bubble {
  position: absolute;
  top: 25px;
  right: 26px;
  background: var(--cream);
  border: 1px solid #bbc7aa;
  padding: 12px 20px;
  border-radius: 18px 18px 0 18px;
  font:
    italic 24px Georgia,
    serif;
  color: var(--green);
  z-index: 1;
}
.speech-bubble span {
  display: block;
  font: 9px/2 sans-serif;
  color: var(--muted);
}
.shelf {
  position: absolute;
  bottom: 0;
  left: 15px;
  right: 15px;
  border-bottom: 10px solid #b67d50;
  display: flex;
  justify-content: flex-start;
  align-items: flex-end;
  height: 93px;
}
.shelf .item-art {
  width: 87px;
  height: 90px;
}
.counter {
  background: #d9ad7c;
  border-top: 2px solid #8e7553;
  text-align: center;
  padding: 25px 0;
  color: #695743;
  font-size: 10px;
  letter-spacing: 0.16em;
  background-image: repeating-linear-gradient(
    90deg,
    transparent 0 84px,
    #c99b6c 85px,
    transparent 86px
  );
}
.shop-stamp {
  position: absolute;
  right: -24px;
  bottom: -24px;
  display: grid;
  align-content: center;
  text-align: center;
  background: #f6efdb;
  border: 1px solid #bbc2a9;
  outline: 5px solid var(--paper);
  border-radius: 50%;
  height: 91px;
  width: 91px;
  transform: rotate(-11deg);
  font:
    10px/1.8 Georgia,
    serif;
  color: var(--green);
  letter-spacing: 0.08em;
}
.shop-stamp strong {
  font: 12px/2 sans-serif;
}
.how-to {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 32px 25px;
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr 1fr;
  gap: 20px;
  align-items: center;
}
.how-intro h2 {
  font-size: 15px;
  margin-top: 8px;
}
.how-step {
  display: flex;
  gap: 13px;
  align-items: center;
}
.how-step > span {
  font:
    27px Georgia,
    serif;
  color: #b08f60;
}
.how-step h3 {
  font-size: 13px;
  margin-bottom: 8px;
}
.how-step p {
  font-size: 11px;
  color: var(--muted);
}
.progress-strip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 32px 25px 40px;
}
.progress-strip > div > p {
  font-size: 14px;
  margin-top: 5px;
}
.progress-strip strong {
  margin-left: 20px;
}
.progress-strip > .muted {
  font-size: 11px;
}
.decorations {
  color: var(--coral);
  margin-left: 15px;
  font-size: 24px;
  letter-spacing: 0.1em;
}
body > footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 0;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.08em;
}
body > footer span {
  font-size: 9px;
}
.view-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 42px 0 28px;
}
.view-head h1 {
  font-family: serif;
  font-size: 32px;
  margin: 8px 0;
}
.view-head > .quiet {
  flex-shrink: 0;
}
.intro-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}
.word-card {
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 22px;
  text-align: center;
}
.word-card .item-art {
  height: 125px;
  width: 140px;
}
.word-card h2 {
  font-size: 15px;
  margin: 4px 0 13px;
}
.word-card > p[lang="en"]:not(.word-en) {
  font:
    17px/1.6 Georgia,
    serif;
}
.word-card .muted {
  font-size: 12px;
}
.word-en {
  font:
    30px/1.4 Georgia,
    serif !important;
  color: var(--green);
}
.card-audio {
  display: flex;
  justify-content: center;
  gap: 9px;
  margin-top: 18px;
}
.card-audio button {
  min-width: 80px;
}
.audio-status {
  font-size: 11px;
  color: var(--muted);
  min-height: 21px;
  margin: 10px 0;
  overflow-wrap: anywhere;
}
.center-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin: 30px 0 50px;
  flex-wrap: wrap;
}
.game-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 30px 0 24px;
}
.game-heading h1 {
  font-size: 22px;
  margin-top: 4px;
}
.delivery-progress strong {
  font:
    30px Georgia,
    serif;
}
.delivery-progress small {
  font: 12px sans-serif;
  color: var(--muted);
}
.progress-dots {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}
.progress-dots span {
  width: 16px;
  height: 5px;
  border-radius: 3px;
  background: #dddccb;
}
.progress-dots .done {
  background: var(--green);
}
.progress-dots .current {
  background: var(--coral);
}
.game-layout {
  display: grid;
  grid-template-columns: minmax(0, 810px) 1fr;
  gap: 48px;
  align-items: start;
  margin-bottom: 42px;
}
.game-panel {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 26px 32px;
  background: var(--cream);
}
.customer {
  display: flex;
  align-items: center;
  gap: 20px;
}
.customer > img {
  width: 85px;
  height: 85px;
  background: #f4eacf;
  border-radius: 50%;
  padding: 4px;
}
.request-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 7px;
}
.hint-actions {
  display: flex;
  gap: 20px;
}
.hint-button {
  background: transparent;
  border-bottom: 1px dashed #91a38a;
  color: #516a57;
  font-size: 12px;
  min-height: 36px;
  padding: 4px;
}
.request-text {
  font:
    26px/1.5 Georgia,
    serif;
  margin-top: 12px;
}
.meaning-text {
  font-size: 13px;
  margin: 5px 0;
}
.stage-list {
  display: flex;
  list-style: none;
  margin: 23px 0 20px;
  padding: 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.stage-list li {
  flex: 1;
  text-align: center;
  font-size: 11px;
  padding: 12px 0;
  color: #929a8c;
}
.stage-list .active {
  color: var(--green);
  background: #edf1e7;
  font-weight: bold;
  box-shadow: inset 0 -2px var(--green);
}
.stage-list .finished {
  color: var(--green);
}
.task-heading {
  font-size: 17px;
  margin-bottom: 15px;
}
.choices {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
}
.choice {
  background: #f5f2e7;
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 12px 9px 9px;
  min-width: 0;
}
.choice:hover {
  border-color: var(--green);
  background: #edf1e7;
  filter: none;
}
.choice .item-art {
  width: 145px;
  height: 140px;
  object-fit: contain;
}
.choice > span {
  display: block;
  font:
    11px Georgia,
    serif;
  letter-spacing: 0.12em;
  color: #8a917f;
}
.feedback {
  font-size: 13px;
  margin: 16px 0 6px;
  color: var(--green);
  min-height: 24px;
}
.shop-note {
  padding: 25px 8px 15px;
  position: relative;
}
.shop-note h2 {
  font-family: serif;
  font-size: 25px;
  line-height: 1.9;
  margin: 17px 0;
}
.shop-note > p:not(.eyebrow):not(.micro) {
  font-size: 12px;
  color: var(--muted);
  line-height: 2.3;
  margin: 16px 0;
}
.note-rule {
  height: 1px;
  width: 35px;
  background: #bdc5b3;
  margin: 25px 0;
}
.note-flower {
  display: block;
  font-size: 50px;
  color: var(--coral);
  margin: 20px 0;
}
.shop-note > .text-button {
  border-bottom: 1px solid #bdc5b3;
}
.shop-note > .micro {
  margin-top: 10px;
}
.parcel {
  display: flex;
  gap: 20px;
  align-items: center;
  background: #f5f1e4;
  padding: 18px;
  border-radius: 9px;
}
.parcel-art {
  width: 105px;
  text-align: center;
  flex-shrink: 0;
}
.parcel-art .item-art {
  width: 105px;
  height: 105px;
}
.parcel-art > span {
  font-size: 10px;
  color: var(--muted);
  display: block;
}
.shipping-label {
  background: var(--cream);
  border: 1px dashed #bbc5ae;
  border-radius: 5px;
  padding: 16px;
  flex: 1;
  min-width: 0;
}
.shipping-label h2 {
  font-size: 14px;
  margin: 5px 0 12px;
}
.word-input {
  display: block;
  width: 100%;
  min-height: 50px;
  background: white;
  border: 1px solid #aebfa6;
  border-radius: 5px;
  padding: 9px 12px;
  color: var(--green);
  font:
    25px Georgia,
    serif;
  letter-spacing: 0.06em;
}
.word-input::placeholder {
  font: 12px sans-serif;
  letter-spacing: 0;
  color: #9a9f93;
}
.typing-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 13px;
}
.typing-actions button {
  font-size: 12px;
  gap: 0;
  padding: 10px;
}
.model-guide {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 12px;
  padding: 10px;
  background: #f7efd7;
  border-radius: 5px;
  overflow-wrap: anywhere;
}
.model-label {
  font-size: 9px;
  color: #907642;
}
.model-word {
  display: flex;
  flex-wrap: wrap;
  font:
    24px Georgia,
    serif;
  letter-spacing: 0.07em;
}
.matched {
  color: #69816a;
}
.next-letter {
  background: #f2d277;
  outline: 2px solid #d49b29;
  border-radius: 3px;
  color: #4b542c;
}
.guide-message {
  font-size: 10px;
}
.completed-label {
  font:
    30px Georgia,
    serif;
  color: var(--green);
  letter-spacing: 0.06em;
}
.completed-label span {
  font-size: 18px;
  margin-left: 10px;
}
.retry-actions {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}
.letter-feedback {
  font-size: 10px;
  margin: 9px 0;
  line-height: 1.8;
}
.letter-feedback .letter-ok,
.letter-feedback .letter-wrong {
  font: 20px monospace;
  white-space: pre;
}
.letter-ok {
  color: var(--green);
}
.letter-wrong {
  text-decoration: underline wavy;
  color: #b65b43;
}
.delivered-actions {
  margin-top: 18px;
}
.delivered-actions .micro {
  margin-top: 6px;
}
.copy-box {
  background: #f4f1e5;
  border-radius: 7px;
  padding: 15px;
  margin-top: 14px;
}
.copy-box > label {
  font-size: 11px;
  display: block;
  margin: 10px 0;
}
.copy-box > .quiet {
  margin-top: 10px;
}
.copy-model {
  font:
    22px/1.5 Georgia,
    serif;
}
.keyboard {
  margin: 25px -6px -6px;
  background: #eaece1;
  border: 1px solid #d5ddca;
  border-radius: 10px;
  padding: 12px;
  user-select: none;
}
.keyboard-top {
  display: flex;

      : byId[a.itemId].lemma;

  if (guide) guide.innerHTML = guideMarkup(input.value, target);

  const input = activeInput();
  if (!input) return;
  if (key === "Shift") {
    shifted = !shifted;
    updateGuide();
    return;
  }
  if (key === "Enter") {
    perform(input.id === "copy-input" ? "submit-copy" : "submit-word");
    return;
  }
  const start = input.selectionStart ?? input.value.length,
    end = input.selectionEnd ?? start;
  const pos =
    key === "Backspace" && start === end ? Math.max(0, start - 1) : start;
  const replacement =
    key === "Backspace" ? "" : shifted ? key.toUpperCase() : key;
  input.value = (
    input.value.slice(0, pos) +
    replacement +
    input.value.slice(end)

  input.setSelectionRange(pos + replacement.length, pos + replacement.length);

  if (action === "clear-input" || action === "retry-word") {
    const input = activeInput();
    if (input) {
      input.value = "";
      inputChanged(input);
      input.focus();
    }
    return;
  }
  if (action === "handover") {
    stopAudio();
    handover(state);
    persist();
    render();
    return;
  }
  if (action === "copy-open") {
    a.copyOpen = !a.copyOpen;
    persist();
    render();
    if (a.copyOpen) focusInput();
    return;
  }
  if (action === "submit-copy") {
    if (composing) return;
    submitCopy(state, document.querySelector("#copy-input").value);
    persist();
    render();
    if (!a.copyDone) focusInput();
    return;
  }
  if (action === "next") {
    stopAudio();
    advance(state);
    persist();
    render();
    autoPlay();
    window.scrollTo({ top: 0 });
    return;
  }
  if (action === "export") {
    const blob = new Blob([JSON.stringify(state, null, 2)], {
      type: "application/json",
    });
    const url = URL.createObjectURL(blob),
      link = document.createElement("a");
    link.href = url;
    link.download = `english-errands-${new Date().toISOString().slice(0, 10)}.json`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return;
  }
  if (action === "delete") {
    stopAudio();
    try {
      storage.removeItem(STORAGE_KEY);
      warn("");
    } catch {
      warn(
        "端末の記録を削除できませんでした。ブラウザの保存設定を確認してください。",
      );
      return;
    }
    state = freshState();
    settingsMessage = "この作品の記録を削除しました。";
    render();
    return;
  }
}
document.addEventListener("click", (event) => {
  const target = event.target.closest("button, .brand");
  if (!target) return;
  if (target.matches(".brand")) {
    event.preventDefault();
    navigate("title");
    return;
  }
  if (target.dataset.key !== undefined) {
    screenKey(target.dataset.key);
    return;
  }
  if (target.dataset.choice) {
    choose(state, target.dataset.choice);
    if (state.session.phase === "typing") stopAudio();
    persist();
    render();
    if (state.session.phase === "typing") focusInput();
    return;
  }
  if (target.dataset.favorite) {
    const id = target.dataset.favorite;
    state.favorites = state.favorites.includes(id)
      ? state.favorites.filter((v) => v !== id)
      : [...state.favorites, id];
    persist();
    render();
    return;
  }
  perform(target.dataset.action || target.dataset.nav, target.dataset.id);
});
document.addEventListener("pointerdown", (event) => {
  if (event.target.closest("[data-key]")) event.preventDefault();
});
document.addEventListener("input", (event) => {
  if (
    event.target.matches("#word-input, #copy-input") &&
    !event.target.readOnly
  )
    inputChanged(event.target, "physical");
});
document.addEventListener("compositionstart", () => {
  composing = true;
});
document.addEventListener("compositionend", () => {
  composing = false;
});
document.addEventListener("keydown", (event) => {
  if (
    event.target.matches("#word-input, #copy-input") &&
    event.key === "Enter" &&
    !event.isComposing &&
    !composing &&
    event.keyCode !== 229
  ) {
    event.preventDefault();
    perform(event.target.id === "copy-input" ? "submit-copy" : "submit-word");
  }
});
document.addEventListener("change", async (event) => {
  const field = event.target.dataset.setting;
  if (field) {
    state.settings[field] =
      event.target.type === "checkbox"
        ? event.target.checked
        : field === "rate"
          ? Number(event.target.value)
          : event.target.value;
    stopAudio();
    persist();
    render();
    return;
  }
  if (event.target.id === "import-file") {
    const file = event.target.files[0];
    if (!file) return;
    try {
      if (file.size > 5_000_000)
        throw new Error("5MB以内のJSONを選んでください。");
      const imported = parseState(await file.text());
      stopAudio();
      state = imported;
      persist();
      settingsMessage = "記録を読み込みました。途中のおつかいも再開できます。";
    } catch {
      settingsMessage =
        "読み込めませんでした。この作品の正しい形式のJSONを選んでください。現在の記録は変更していません。";
    }
    render();
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    stopAudio();
    persist();
  }
});
render();

return {  };
})();
})();
</script>
</body>
</html>
