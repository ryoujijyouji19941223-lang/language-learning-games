 θέα είναι δωρεάν.`,`Of course! Sit down. The view is free.`),W(`Εγώ προτιμώ το βουνό από τη θάλασσα.`,`I prefer the mountains to the sea.`,`Ε, το νησί έχει και τα δύο. Τι τύχη!`,`Well, the island has both. What luck!`)]},{id:`g08`,name:`Χρυσούλα`,role:U(`μαστόρισσα στα δίχτυα`,`net mender`),district:`limani`,formal:!1,look:`f o 3 #bdbdbd scarf #4d6b3c #3a2f28 skirt short scarf`,am:`quay`,pm:`quay`,topic:U(`Αυτό το δίχτυ θέλει υπομονή. Πολλή υπομονή.`,`This net needs patience. Lots of patience.`),replies:[W(`Μπορείς να μου δείξεις πώς το κάνεις;`,`Can you show me how you do it?`,`Κάθισε και κοίτα τα χέρια μου. Σιγά σιγά.`,`Sit and watch my hands. Slowly, slowly.`),W(`Εγώ δεν έχω καθόλου υπομονή!`,`I've got no patience at all!`,`Χα! Τότε μην πιάσεις ποτέ δίχτυ.`,`Ha! Then never pick up a net.`),W(`Πόσα χρόνια κάνεις αυτή τη δουλειά;`,`How many years have you done this?`,`Από μικρό κορίτσι. Μου το έμαθε η μάνα μου.`,`Since I was a little girl. My mother taught me.`)]},{id:`g09`,name:`Νίκος`,role:U(`λάτρης της φωτογραφίας`,`photography fan`),district:`limani`,formal:!1,look:`m y 1 #3b2618 curly #2e7d6b #c9b48a shorts slim camera`,am:`breakwater`,pm:`lookout`,topic:U(`Το φως εδώ το απόγευμα είναι απίστευτο.`,`The light here in the afternoon is incredible.`),replies:[W(`Ναι, όλα γίνονται χρυσά.`,`Yes, everything turns golden.`,`Ακριβώς! Γι’ αυτό έχω πάντα την κάμερα μαζί μου.`,`Exactly! That is why I always carry my camera.`),W(`Εγώ βγάζω φωτογραφίες μόνο με το κινητό.`,`I only take photos with my phone.`,`Δεν πειράζει. Το μάτι μετράει, όχι η κάμερα.`,`Doesn't matter. The eye counts, not the camera.`),W(`Εγώ προτιμώ το πρωινό φως.`,`I prefer the morning light.`,`Κι αυτό έχει τη χάρη του. Πιο καθαρό.`,`That has its charm too. Clearer.`)]},{id:`g10`,name:`Αργυρώ`,role:U(`περιπτερού`,`kiosk keeper`),district:`limani`,formal:!0,look:`f m 2 #6b3a1e curly #c2185b #33302e trousers avg glasses`,work:`port_kiosk`,am:`quay`,pm:`quay`,topic:U(`Νερό, εφημερίδα, κάρτα; Όλα τα έχει το  και σαρδέλες. Και χωριάτικη, φυσικά!`,`No matter, we have sardines too. And a village salad, of course!`)]},{id:`g13`,name:`Κώστας`,role:U(`σερβιτόρος`,`waiter`),district:`limani`,formal:!0,look:`m y 2 #1b1b1b short #f2f2f2 #1f1f1f trousers slim vest`,work:`port_taverna`,am:`beach`,pm:`quay`,topic:U(`Καλησπέρα! Για πόσα άτομα;`,`Good evening! For how many people?`),replies:[W(`Για ένα άτομο, παρακαλώ.`,`For one, please.`,`Ελάτε από εδώ. Νερό και ψωμί έρχονται αμέσως.`,`This way, please. Water and bread are coming right away.`),W(`Μόνο περνούσα, ευχαριστώ.`,`I was only passing by, thanks.`,`Καλή βόλτα! Όποτε θέλετε, σας περιμένουμε.`,`Enjoy your walk! We're here whenever you like.`),W(`Πάντα φέρνετε νερό και ψωμί;`,`Do you always bring water and bread?`,`Πάντα! Πρώτα νερό και ψωμί, μετά η παραγγελία.`,`Always! First water and bread, then the order.`)]},{id:`g14`,name:`Ρένα`,role:U(`μαγείρισσα`,`cook`),district:`limani`,formal:!1,look:`f m 3 #4a2c1c scarf #f5f5f5 #3c3c3c trousers broad apron`,work:`port_taverna`,am:`agora_street`,pm:`quay`,topic:U(`Το μυστικό είναι το καλό λάδι. Τίποτα άλλο.`,`The secret is good olive oil. Nothing else.`),replies:[W(`Και λίγη ρίγανη, ίσως;`,`And a little oregano, maybe?`,`Ε, ναι, και ρίγανη. Αλλά μην το πεις σε κανέναν!`,`Well, yes, and oregano. But don't tell anyone!`),W(`Εγώ μαγειρεύω πολύ απλά.`,`I cook very simply.`,`Το απλό είναι το καλύτερο. Ντομάτα, λάδι, αλάτι.`,`Simple is best. Tomato, oil, salt.`),W(`Μπορείς να μου μάθεις μια συνταγή;`,`Can you teach me a recipe?`,`Φτιάξε μια χωριάτικη. Τη φέτα από πάνω, ολόκληρη!`,`Make a village salad. The feta on top, in one piece!`)]},{id:`g15`,name:`Αλέκος`,role:U(`ψαράς με γάτα`,`fisherman with a cat`),district:`limani`,formal:!1,look:`m o 3 #a0a0a0 short #5c3b2e #3f3f3f trousers avg fishercap,beard`,am:`quay`,pm:`breakwater`,topic:U(`Η γάτα μου ξέρει πότε γυρίζει η βάρκα. Δεν ξέρω πώς.`,`My cat knows when the boat comes back. I don't know how.`),replies:[W(`Οι γάτες ξέρουν πολλά μυστικά.`,`Cats know a lot of secrets.`,`Ναι. Και τρώνε και τα καλύτερα ψάρια!`,`Yes. And they eat the best fish, too!`),W(`Πώς τη λένε τη γάτα σου;`,`What's your cat called?`,`Καπετάνισσα. Αυτή κάνει κουμάντο στη βάρκα.`,`Kapetanissa — 'lady captain'. She runs the boat.`),W(`Εγώ προτιμώ τους σκύλους.`,`I prefer dogs.`,`Μην το λες δυνατά. Η Καπετάνισσα ακούει!`,`Don't say it out loud. Kapetanissa is listening!`)]},{id:`g16`,name:`Βασίλης`,role:U(`φούρναρης`,`baker`),district:`agora`,formal:!0,look:`m m 1 #3d2b1f short #fafafa #6d6d6d trousers broad apron,bakerhat,mustache`,work:`agora_bakery`,am:`square`,pm:`agora_street`,topic:U(`Η τυρόπιτα βγήκε τώρα από τον φούρνο. Ζεστή ακόμα!`,`The cheese pie just came out of the oven. Still warm!`),replies:[W(`Μυρίζει υπέροχα!`,`It smells wonderful!`,`Βούτυρο και φέτα. Το πρωί είναι η καλύτερη ώρα.`,`Butter and feta. Morning is the best time.`),W(`Ξυπνάτε πολύ νωρίς για τον φούρνο;`,`Do you get up very early for the bakery?`,`Στις τέσσερις! Αν θέλετε δουλειά, ελάτε στις έξι.`,`At four! If you want work, come at six.`),W(`Προτιμώ κάτι γλυκό το πρωί.`,`I prefer something sweet in the morning.`,`Τότε δοκιμάστε μια μπουγάτσα. Με κανέλα!`,`Then try a bougatsa. With cinnamon!`)]},{id:`g17`,name:`Σοφία`,role:U(`πωλήτρια στον φούρνο`,`bakery assistant`),district:`agora`,formal:!0,look:`f y 2 #7a4a26 pony #f6d7a7 #3b3b3b trousers slim apron`,work:`agora_bakery`,am:`agora_street`,pm:`beach`,topic:U(`Κουλούρι ή κάτι γλυκό; Πείτε μου.`,`A koulouri or something sweet? Tell me.`),replies:[W(`Ένα κουλούρι μου φτάνει.`,`A koulouri is enough for me.`,`Απλό και καλό. Με σουσάμι, φρέσκο.`,`Simple and good. With sesame, fresh.`),W(`Κάτι γλυκό, σίγουρα!`,`Something sweet, definitely!`,`Σας καταλαβαίνω. Η μπουγάτσα φεύγει πρώτη!`,`I understand. The bougatsa sells out first!`),W(`Δεν ξέρω ακόμα. Κοιτάζω.`,`I don't know yet. I'm looking.`,`Με την ησυχία σας. Όλα είναι του πρωινού.`,`Take your time. It's all from this morning.`)]},{id:`g18`,name:`Λευτέρης`,role:U(`ιδιοκτήτης καφετέριας`,`café owner`),district:`agora`,formal:!0,look:`m m 2 #1c1c1c cropped #1f4e8c #2b2b2b trousers tall beard`,work:`agora_cafe`,am:`quay`,pm:`square`,topic:U(`Ο φρέντο εσπρέσο θέλει καλό χτύπημα. Αυτό είναι όλο.`,`A freddo espresso needs a good shake. That is all.`),replies:[W(`Μπορείτε να μου δείξετε;`,`Can you show me?`,`Ελάτε να δουλέψετε εδώ και θα μάθετε! Δύο ώρες, δεκαοκτώ ευρώ.`,`Come and work here and you'll learn! Two hours, eighteen euros.`),W(`Εγώ πίνω πάντα ζεστό καφέ.`,`I always drink hot coffee.`,`Και τον Αύγουστο; Είστε γενναίος άνθρωπος!`,`Even in August? You're a brave person!`),W(`Ο φραπές είναι καλύτερος, νομίζω.`,`I think the frappé is better.`,`Α, ο φραπές είναι κλασικός. Δεν θα μαλώσουμε!`,`Ah, the frappé is a classic. We won't argue!`)]},{id:`g19`,name:`Ιωάννα`,role:U(`μπαρίστα`,`barista`),district:`agora`,formal:!0,look:`f y 1 #c48a3a pony #263238 #263238 trousers slim apron`,work:`agora_cafe`,am:`beach`,pm:`agora_street`,topic:U(`Τον θέλετε σκέτο, μέτριο ή γλυκό;`,`Do you want it unsweetened, medium or sweet?`),replies:[W(`Σκέτο, παρακαλώ.`,`No sugar, please.`,`Σκέτο, χωρίς ζάχαρη. Δυνατός καφές, μπράβο!`,`No sugar at all. A strong coffee, well done!`),W(`Μέτριο. Λίγη ζάχαρη μόνο.`,`Medium. Just a little sugar.`,`Μέτριο, η χρυσή τομή. Ωραία επιλογή.`,`Medium, the golden mean. Nice choice.`),W(`Γλυκό! Μου αρέσει η ζάχαρη.`,`Sweet! I like sugar.`,`Γλυκό, λοιπόν. Η ζωή θέλει και λίγη γλύκα!`,`Sweet it is. Life needs a little sweetness!`)]},{id:`g20`,name:`Μιχάλης`,role:U(`μανάβης`,`greengrocer`),district:`agora`,formal:!0,look:`m o 3 #9e9e9e short #6b8e23 #4a4a4a trousers broad apron,cap`,work:`agora_greengrocer`,am:`quay`,pm:`kafeneio_out`,topic:U(`Οι ντομάτες σήμερα είναι από το χωριό. Μυρίστε τες!`,`Today's tomatoes are from the village. Smell them!`),replies:[W(`Μυρίζουν καλοκαίρι!`,`They smell of summer!`,`Έτσι ακριβώς! Για χωριάτικη, είναι τέλειες.`,`Exactly! Perfect for a village salad.`),W(`Είναι λίγο ακριβέ ι μαγαζί θέλεις να ανοίξεις;`,`What kind of place do you want to open?`,`Μια μικρή ταβέρνα, με φαγητά της γιαγιάς μου.`,`A little taverna, with my grandmother's dishes.`),W(`Θα έρθω την πρώτη μέρα!`,`I'll come on the first day!`,`Υπόσχεση; Θα σου κρατήσω το καλύτερο τραπέζι.`,`Promise? I'll keep you the best table.`),W(`Είναι δύσκολο να ανοίξεις μαγαζί.`,`It's hard to open a place.`,`Το ξέρω. Γι’ αυτό μαζεύω λεφτά από τώρα.`,`I know. That's why I'm saving money now.`)]},{id:`g60`,name:`Ηρώ`,role:U(`δασκάλα πιάνου`,`piano teacher`),district:`geitonia`,formal:!1,look:`f m 1 #4a2c2a long #3949ab #eeeeee skirt slim glasses`,am:`geitonia_street`,pm:`square_bench`,topic:U(`Αν ακούσεις πιάνο το απόγευμα, είμαι εγώ. Συγγνώμη!`,`If you hear a piano in the afternoon, it's me. Sorry!`),replies:[W(`Μου αρέσει πολύ να σε ακούω.`,`I really like listening to you.`,`Αλήθεια; Τότε θα παίζω πιο δυνατά!`,`Really? Then I'll play louder!`),W(`Τι παίζεις συνήθως;`,`What do you usually play?`,`Λίγο Χατζιδάκι, λίγο Σοπέν. Ό,τι θέλει η μέρα.`,`A little Hadjidakis, a little Chopin. Whatever the day wants.`),W(`Δεν ακούω τίποτα από το σπίτι μου.`,`I can't hear anything from my home.`,`Ωραία! Τότε δεν ενοχλώ κανέναν.`,`Good! Then I'm not bothering anyone.`)]},{id:`g61`,name:`Ανδρέας`,role:U(`ναυαγοσώστης`,`lifeguard`),district:`paralia`,formal:!1,look:`m y 3 #2b1d0e cropped #e53935 #e53935 shorts tall whistle,cap`,am:`beach`,pm:`beach`,topic:U(`Σήμερα έχει λίγο κύμα. Πρόσεχε.`,`There are some waves today. Be careful.`),replies:[W(`Ευχαριστώ, θα προσέχω.`,`Thanks, I'll be careful.`,`Μπράβο. Και κολύμπα μέσα στις σημαδούρες.`,`Good. And swim inside the buoys.`),W(`Μου αρέσουν τα κύματα!`,`I like waves!`,`Κι εμένα. Αλλά από μακριά, όταν δουλεύω!`,`Me too. But from a distance, when I'm working!`),W(`Σήμερα δεν θα κολυμπήσω.`,`I won't swim today.`,`Καλή ιδέα. Αύριο θα είναι λάδι, λένε.`,`Good idea. They say tomorrow it'll be flat calm.`)]},{id:`g62`,name:`Ιφιγένεια`,role:U(`ιδιοκτήτρια της καντίνας
